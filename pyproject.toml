[project]
name = "todoist-toggletrak"
version = "0.1.0"
description = "Sync Todoist task creation with Toggl Track time entries"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask==3.0.3",
    "gunicorn==22.0.0",
    "requests==2.33.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
